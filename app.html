<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>員工申訴</title>
<style>
:root{--ink:#1f2a33;--muted:#5d6b76;--line:#d5dce1;--accent:#22577a;--bad:#a4262c}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#f5f7f8}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:14px 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.note{background:#fff6e0;border:1px solid #d9a521;border-radius:10px;padding:12px 14px;margin:12px 0}
.test{background:var(--bad);color:#fff;text-align:center;padding:4px;font-size:14px}
label{display:block;font-weight:600;margin:14px 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #aab6be;border-radius:8px;background:#fff}
textarea{min-height:110px;resize:vertical}
button{width:100%;min-height:46px;font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:10px;margin-top:12px}
button.alt{background:#fff;color:var(--accent)}
button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.55}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.row{display:block;width:100%;text-align:left;font-weight:400;background:#fff;color:var(--ink);border:1px solid var(--line);margin:8px 0}
.row strong{color:var(--accent)}
.muted{color:var(--muted);font-size:14px}
.pre{white-space:pre-wrap;word-break:break-word}
dl{margin:0}dt{color:var(--muted);font-size:14px;margin-top:8px}dd{margin:0;white-space:pre-wrap;word-break:break-word}
canvas{display:block;width:100%;height:160px;border:1px solid #aab6be;border-radius:8px;background:#fff;touch-action:none}
img.ev{display:block;max-width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px}
.tabs{display:flex;gap:8px}.tabs button{margin-top:8px}
[hidden]{display:none!important}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="test" id="envBanner" hidden>測試環境：請只輸入假資料</div>
<main id="root"><p class="muted" id="boot">載入中…</p></main>
<script>
(function () {
  'use strict';
  var API_URL = 'https://script.google.com/macros/s/AKfycbwThZIsyDU-NLlrtk7yES3jy3y3MdOzq1B2KN45Lx5RRZjro7d85BhCGFymLpGOB-Kx/exec', LIFF_ID = '2012353880-tHRiRcUu';
  var root = document.getElementById('root');
  var idToken = '', info = null;

  /* Builds elements with text only, so nothing a person typed can run as code. */
  function h(tag, props) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {

          report: { category: f.category.value, incident_date: f.date.value, incident_time: f.time.value, location: f.location.value, respondent: f.respondent.value, narrative: f.narrative.value, witnesses: f.witnesses.value, other_info: f.other.value }

            screen(h('section', { class: 'card' }, h('h2', { text: '已收到你的申訴' }), h('p', { text: '案件編號：' + r.caseId }),
              failed ? h('div', { class: 'err', text: failed + ' 個檔案未能上傳，請到案件頁面補傳。' }) : null,
              h('p', { class: 'hint', text: '案件有進度時，LINE 會通知你開啟這個頁面查看。' }),
              h('button', { class: 'alt', text: '回到我的案件', onclick: complainantHome })));
          });
        });
      }, '送出中…');
    };
    screen(h('h1', { text: '具名正式申訴' }), h('section', { class: 'card' },
      field('所屬公司', f.employer), field('姓名', f.name), field('服務單位及職稱', f.unit), field('住居所', f.address), field('聯絡電話', f.phone), field('代理人資料', f.agent, '可不填'),
      field('申訴類別', f.category), field('事件日期', f.date, '可不填'), field('事件時間', f.time, '可不填'), field('地點', f.location, '可不填'), field('被申訴對象', f.respondent, '可不填'),
      field('事件經過', f.narrative), field('證人資訊', f.witnesses, '可不填'), field('其他補充資料', f.other, '可不填'),

  }
  function complainantCase(c) {

  }

  /* ---------- administrators ---------- */
  var EVENT_LABELS = { created: '建立案件', status_change: '更新狀態', note: '處理紀錄', protection: '保護措施', finding: '調查結果', extend_due: '延長期限', authority_received: '標記已通知／登錄主管機關', authority_result: '標記已通知／登錄處理結果', recuse: '迴避', recused: '迴避' };
  var ACTION_LABELS = { list_cases: '查看案件清單', view_case: '查看案件', download_evidence: '查看證據', upload_evidence: '上傳證據', evidence_upload: '上傳證據', create_case: '代建案件', view_log: '查看操作紀錄', admin_ping: '開啟管理頁', anon_create: '匿名通報', anon_supplement: '匿名補件', anon_rate_limited: '匿名通報達到上限', named_create: '具名申訴', named_supplement: '具名補件', add_note: '新增紀錄', set_status: '更新狀態', mark_authority: '標記主管機關', recuse: '迴避' };
  var STATUS_NAMES = { received: '已收到', accepted: '已受理', not_accepted: '不予受理', protecting: '採取保護措施中', mediating: '協調中', investigating: '調查中', decided: '已作成決定', closed: '已結案', reconsideration: '申復處理中', recused: '已迴避' };
  function when(t) { return String(t || '').slice(0, 16).replace('T', ' '); }
  function who_(a) { return String(a).replace(/^admin:(.{6}).*/, '管理員 $1').replace(/^denied:(.{6}).*/, '未授權者 $1').replace('complainant', '申訴人').replace('anonymous', '匿名者'); }
  function adminHome() {
    var list = h('div', { text: '載入中…' }), err = h('div', { class: 'err', role: 'alert' }), warn = h('div');
    screen(h('h1', { text: '申訴案件管理' }), warn,
      h('div', { class: 'tabs' }, h('button', { class: 'alt', text: '代建案件', onclick: adminCreate }), h('button', { class: 'alt', text: '操作紀錄', onclick: adminLog })),
      h('section', { class: 'card' }, h('h2', { text: '案件' }), list, err));
    call('cpAdminList', idToken).then(function (r) {
      if (!r.logIntact) warn.appendChild(h('div', { class: 'note', text: '操作紀錄檢查未通過，可能遭到更動，請查看。' }));
      if (r.failedNotices) warn.appendChild(h('div', { class: 'note', text: r.failedNotices + ' 則 LINE 通知發送失敗。' }));
      list.textContent = r.cases.length ? '' : '目前沒有案件。';
      r.cases.slice().reverse().forEach(function (c) {
        list.appendChild(h('button', { class: 'row', disabled: c.status === 'recused', onclick: function () { adminCase(c.caseId); } },
          h('strong', { text: c.caseId }), h('div', { text: [c.category, c.statusLabel].filter(String).join('｜') }),
          h('div', { class: 'muted', text: '收件 ' + c.receivedDate + (c.dueDate ? '｜期限 ' + c.dueDate : '') + (c.employer ? '｜' + c.employer : '') })));
      });
    }).catch(function (e) { list.textContent = ''; err.textContent = e.message; });
  }
  function dl(pairs) {

    return box;
  }
  function adminCase(id) {
    screen(h('p', { class: 'muted', text: '載入中…' }));
    call('cpAdminCase', idToken, id).then(function (c) {
      var d = c.details, who = c.identity, k = c.kase, err = h('div', { class: 'err', role: 'alert' });

      var noteKind = options([['note', '處理紀錄'], ['protection', '保護措施'], ['finding', '調查結果']]), noteText = h('textarea', { maxlength: 10000 }), notePublic = h('input', { type: 'text', maxlength: 500 });

      var nextSel = options(c.nextStatuses.map(function (s) { return [s.value, s.label]; })), statusNote = h('textarea', { maxlength: 10000 }), statusPublic = h('input', { type: 'text', maxlength: 500 });

      mark1.onclick = function () { run(mark1, err, function () { return call('cpAdminMarkAuthority', idToken, id, 'received').then(function () { adminCase(id); }); }); };
      var mark2 = h('button', { class: 'alt', text: k.result_notified_at ? '已通報結果（' + k.result_notified_at.slice(0, 10) + '）' : '標記：已通知／登錄處理結果', disabled: !!k.result_notified_at });

      screen(h('button', { class: 'alt', text: '回到案件清單', onclick: adminHome }),
        h('section', { class: 'card' }, h('h2', { text: id }), dl([['類別', c.categoryLabel], ['狀態', c.statusLabel], ['收件方式', { named: '具名', anonymous: '匿名通報（非正式申訴）', admin_created: '代建' }[k.intake_type]], ['所屬公司', k.employer_entity], ['收件', when(k.received_at)], ['受理', when(k.accepted_at)], ['結案期限', k.extended_due_at || k.due_at], ['結案', when(k.closed_at)]])),
        who ? h('section', { class: 'card' }, h('h2', { text: '申訴人' }), dl([['姓名', who.complainant_name], ['服務單位及職稱', who.unit_title], ['住居所', who.address], ['聯絡電話', who.phone], ['代理人', who.agent_info], ['簽名時間', when(who.signed_at)]])) : null,
        h('section', { class: 'card' }, h('h2', { text: '事件內容' }), dl([['日期', d.incident_date], ['時間', d.incident_time], ['地點', d.location], ['被申訴對象', d.respondent], ['事件經過', d.narrative], ['證人', d.witnesses], ['其他', d.other_info]])),
        c.supplements.length ? h('section', { class: 'card' }, h('h2', { text: '補件' }), sup) : null,
        c.attachments.length ? h('section', { class: 'card' }, h('h2', { text: '證據' }), atts) : null,
        k.status !== 'closed' ? h('section', { class: 'card' }, h('h2', { text: '新增紀錄' }), field('類型', noteKind), field('內容', noteText), field('對申訴人的說明', notePublic, '可不填；會顯示在對方的查詢頁'), noteBtn) : null,
        c.nextStatuses.length ? h('section', { class: 'card' }, h('h2', { text: '更新狀態' }), field('新狀態', nextSel), field('內部紀錄', statusNote, '不予受理時必填'), field('對申訴人的說明', statusPublic, '可不填'), statusBtn) : null,
        k.status !== 'closed' ? h('section', { class: 'card' }, h('h2', { text: '期限與主管機關' }), k.due_at && !k.extended_due_at ? extendBtn : null, mark1, mark2, recuse) : null,
        err, h('section', { class: 'card' }, h('h2', { text: '處理過程' }), evts));
    }).catch(function (e) {
      screen(h('div', { class: 'err', text: e.message }), h('button', { class: 'alt', text: '回到案件清單', onclick: adminHome }));
    });
  }
  function adminCreate() {
    var f = {
      channel: h('input', { type: 'text', maxlength: 500, placeholder: '例如 Email、書面、口頭' }), employer: options(info.employers.map(function (x) { return [x, x]; })),
      name: h('input', { type: 'text', maxlength: 500 }), unit: h('input', { type: 'text', maxlength: 500 }), address: h('input', { type: 'text', maxlength: 500 }), phone: h('input', { type: 'tel', maxlength: 50 }),
      category: options(Object.keys(info.categories).map(function (k) { return [k, info.categories[k]]; })), date: h('input', { type: 'date' }), location: h('input', { type: 'text', maxlength: 500 }), respondent: h('input', { type: 'text', maxlength: 500 }), narrative: h('textarea', { maxlength: 10000 })
    };
    var err = h('div', { class: 'err', role: 'alert' }), send = h('button', { text: '建立案件' });
    send.onclick = function () {
      run(send, err, function () {
        return call('cpAdminCreateCase', idToken, { channel: f.channel.value, employer_entity: f.employer.value, identity: { complainant_name: f.name.value, unit_title: f.unit.value, address: f.address.value, phone: f.phone.value }, report: { category: f.category.value, incident_date: f.date.value, location: f.location.value, respondent: f.respondent.value, narrative: f.narrative.value } })
          .then(function (r) { adminCase(r.caseId); });
      });
    };
    screen(h('h1', { text: '代建案件' }), h('div', { class: 'note', text: '用於 Email、書面或口頭收到的申訴。口頭或 Email 申訴須作成紀錄，並請申訴人確認後簽名或蓋章，再把紀錄上傳到案件。' }),
      h('section', { class: 'card' }, field('收件方式', f.channel), field('所屬公司', f.employer), field('申訴人姓名', f.name), field('服務單位及職稱', f.unit, '可不填'), field('住居所', f.address, '可不填'), field('聯絡電話', f.phone, '可不填'), field('類別', f.category), field('事件日期', f.date, '可不填'), field('地點', f.location, '可不填'), field('被申訴對象', f.respondent, '可不填'), field('事件經過', f.narrative), send, err,
        h('button', { class: 'alt', text: '取消', onclick: adminHome })));
  }
  function adminLog() {
    var box = h('div', { text: '載入中…' });
    screen(h('button', { class: 'alt', text: '回到案件清單', onclick: adminHome }), h('section', { class: 'card' }, h('h2', { text: '操作紀錄（最新 100 筆）' }), box));
    call('cpAdminLog', idToken, 100).then(function (r) {
      box.textContent = '';
      box.appendChild(h('p', { text: r.intact ? '紀錄完整性檢查：通過' : '紀錄完整性檢查：未通過，可能遭到更動' }));
      r.rows.forEach(function (x) { box.appendChild(h('p', { class: 'muted pre', text: when(x.at) + '｜' + who_(x.actor) + '｜' + (ACTION_LABELS[x.action] || EVENT_LABELS[x.action] || x.action) + (x.caseId ? '｜' + x.caseId : '') + (x.result !== 'ok' ? '｜' + (x.result === 'denied' ? '已拒絕' : x.result) : '') })); });
    }).catch(function (e) { box.textContent = e.message; });
  }
  function notAdmin(message) {
    var show = h('div');
    var b = h('button', { class: 'alt', text: '顯示我的 LINE ID（設定管理員時使用）' });
    b.onclick = function () { call('cpWhoAmI', idToken).then(function (r) { show.textContent = r.userId; }).catch(function (e) { show.textContent = e.message; }); };
    screen(h('section', { class: 'card' }, h('h2', { text: message }), b, h('p', { class: 'pre' }, show)));
  }

  /* ---------- start ---------- */
  function view() {
    var q = new URLSearchParams(location.search);
    var st = q.get('liff.state');
    return st ? new URLSearchParams(st.replace(/^[^?]*\??/, '')).get('view') : q.get('view');
  }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return null; }
    idToken = liff.getIDToken();
    return call('cpPublicInfo');
  }).then(function (i) {
    if (!i) return;
    info = i;
    if (i.env !== 'PROD') document.getElementById('envBanner').hidden = false;
    if (view() === 'admin') {
      call('cpAdminPing', idToken).then(adminHome).catch(function (e) { notAdmin(e.message); });
    } else {
      complainantHome();
    }
  }).catch(function (e) {
    screen(h('div', { class: 'err', text: '無法開啟：' + (e.message || '請從 LINE 重新開啟') }));
  });
})();
</script>
</body>
